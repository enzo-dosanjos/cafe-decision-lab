[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cafe-decision-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["F", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
